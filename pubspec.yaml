name: neuroxus
description: A personal AI diary app powered by Gemini and Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  table_calendar: ^3.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  google_generative_ai: ^0.4.6
  uuid: ^4.5.2
  flutter_animate: ^4.5.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
